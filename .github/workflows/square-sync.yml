name: Square Sync
on:
  schedule:
    - cron: '0 9 * * *'   # nightly, ~3-4 AM Central
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: square-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Sync catalog from Square
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: python scripts/sync_square.py
      - name: Commit and push changes
        run: |
          git config user.name "square-sync-bot"
          git config user.email "actions@github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync Square catalog"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; echo "Rebase conflict — manual fix needed"; exit 1; }
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected, retrying ($i)…"
            sleep 5
          done
          echo "Could not push after 3 attempts"
          exit 1
